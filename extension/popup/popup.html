<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>代理开关</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="head">
        <div class="brand">
          <span class="brand-icon" aria-hidden="true"
            ><svg viewBox="0 0 24 24">
              <path
                d="M12 3 4.5 6v5.5c0 4.3 3 7.2 7.5 9.5 4.5-2.3 7.5-5.2 7.5-9.5V6Z"
              />
              <path d="m8.5 12 2.3 2.3 4.8-5" /></svg
          ></span>
          <div>
            <h1>代理开关</h1>
            <div class="brand-sub">CLASH / MIHOMO</div>
          </div>
        </div>
        <button
          id="theme"
          class="theme-btn"
          title="切换外观主题"
          aria-label="切换外观主题"
        >
          <svg
            class="action-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
            data-icon="appearance"
          >
            <circle cx="12" cy="12" r="8" />
            <path
              d="M12 4v16M12 4a8 8 0 0 1 0 16"
              fill="currentColor"
              fill-opacity=".18"
            />
          </svg>
          <span id="themeLabel">亮色</span>
        </button>
      </header>

      <section class="status-card" aria-label="实际代理状态">
        <div class="status-top">
          <span id="status" class="pill off" role="status">正在检查</span
          >
        </div>
        <p id="healthDetail">正在读取浏览器代理设置…</p>
      </section>

      <nav class="modes" id="modes" aria-label="代理模式">
        <button class="mode" data-mode="global" aria-pressed="false">
          <svg
            class="action-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
            data-icon="global"
          >
            <circle cx="12" cy="12" r="8.3" />
            <path
              d="M3.7 12h16.6M12 3.7c-4.2 4.5-4.2 12.1 0 16.6 4.2-4.5 4.2-12.1 0-16.6Z"
            />
          </svg>
          全局代理
        </button>
        <button class="mode" data-mode="pac" aria-pressed="false">
          <svg
            class="action-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
            data-icon="split"
          >
            <path d="M6 19v-5a5 5 0 0 1 5-5h7M14.5 5.5 18 9l-3.5 3.5M6 14V5" />
            <circle cx="6" cy="4" r="1.3" />
            <circle cx="6" cy="20" r="1.3" />
          </svg>
          智能分流
        </button>
        <button class="disc" data-mode="direct" aria-pressed="false">
          <svg
            class="action-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
            data-icon="direct"
          >
            <path d="M4 12h15M14 6l6 6-6 6" />
            <path d="M4 7v10" opacity=".45" />
          </svg>
          强制直连
        </button>
      </nav>

      <section class="profile-card" aria-label="代理配置">
        <div class="section-heading">
          <label for="profile">代理配置</label
          ><button
            id="manageBtn"
            class="text-btn"
            aria-controls="manage"
            aria-expanded="false"
          >
            <svg
              class="action-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
              data-icon="settings"
            >
              <path d="M4 7h7m4 0h5M4 17h3m4 0h9" />
              <circle cx="13" cy="7" r="2.3" />
              <circle cx="9" cy="17" r="2.3" />
            </svg>
            管理
          </button>
        </div>
        <select id="profile" class="select" aria-label="选择代理配置">
          <option>正在加载配置…</option>
        </select>
      </section>

      <section id="manage" class="manage hidden" aria-label="编辑代理配置">
        <div class="section-heading">
          <span>编辑配置</span><span class="micro">不是 Clash 订阅节点</span>
        </div>
        <label class="field full"
          ><span>名称</span
          ><input
            id="pname"
            type="text"
            maxlength="100"
            placeholder="本地 Clash"
        /></label>
        <label class="field full"
          ><span>主机</span
          ><input
            id="host"
            type="text"
            placeholder="127.0.0.1"
            spellcheck="false"
        /></label>
        <div class="form-pair">
          <label class="field"
            ><span>协议</span
            ><select id="scheme">
              <option value="http">HTTP</option>
              <option value="socks5">SOCKS5</option>
            </select></label
          ><label class="field"
            ><span>端口</span
            ><input
              id="port"
              type="number"
              min="1"
              max="65535"
              step="1"
              placeholder="7897"
          /></label>
        </div>
        <div class="manage-actions">
          <button id="saveProfile" class="btn primary">
            <svg
              class="action-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
              data-icon="save"
            >
              <path d="M5 3.8h12l3 3V20H4V3.8Z" />
              <path d="M8 3.8v5h8v-5M8 20v-7h8v7" />
            </svg>
            保存配置</button
          ><button id="newProfile" class="btn">
            <svg
              class="action-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
              data-icon="add"
            >
              <path d="M12 5v14M5 12h14" />
            </svg>
            新增</button
          ><button id="deleteProfile" class="btn danger">
            <svg
              class="action-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
              data-icon="delete"
            >
              <path d="M4 6h16M9 6V3.8h6V6M6 6l1 14h10l1-14M10 10v6M14 10v6" />
            </svg>
            删除
          </button>
        </div>
      </section>

      <section class="monitor" aria-label="HTTP 网络监控">
        <div class="stats">
          <div class="stat">
            <div class="stat-label">
              HTTP 耗时
              <span
                title="HTTPS 请求总耗时，包含可能的 DNS、握手与服务端时间；不是 ICMP Ping"
                class="info-mark"
                >i</span
              >
            </div>
            <div class="stat-value">
              <span id="latency">—</span><span class="unit">ms</span>
            </div>
          </div>
          <div class="stat">
            <div class="stat-label">
              相邻波动
              <span
                title="相邻成功样本的耗时差；不跨失败点计算"
                class="info-mark"
                >i</span
              >
            </div>
            <div class="stat-value">
              <span id="jitter">—</span><span class="unit">ms</span>
            </div>
          </div>
        </div>
        <div class="chart-caption">
          <span><i class="live-dot"></i>最近 40 次请求<span id="sampleFailures" title="缺口和底部橙色刻度表示 HTTP 探测失败，不代表代理必然断线"></span></span
          ><span id="delta" class="delta"></span>
        </div>
        <div class="chart-wrap">
          <div class="yaxis" aria-hidden="true">
            <span id="yMax">—</span><span id="yMid">—</span><span>0</span>
          </div>
          <canvas
            id="chart"
            width="320"
            height="56"
            role="img"
            aria-label="HTTP 请求耗时趋势；平滑绘制原始测量值，失败处断开并以底部橙色刻度标记"
          ></canvas>
        </div>
        <div class="egress-row">
          <span class="egress-icon" aria-hidden="true"
            ><svg viewBox="0 0 20 20">
              <circle cx="10" cy="10" r="7" />
              <path d="M3 10h14M10 3c-4 4-4 10 0 14M10 3c4 4 4 10 0 14" /></svg
          ></span>
          <div class="egress-text">
            <div id="egress">正在获取出口…</div>
            <div id="isp" class="isp-line"></div>
          </div>
        </div>
        <div class="monitor-actions">
          <button id="test" class="quiet-btn">
            <svg
              class="action-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
              data-icon="probe"
            >
              <path d="M3 12h4l3-7 4 14 3-7h4" />
            </svg>
            检测链路</button
          ><button id="refreshIp" class="quiet-btn">
            <svg
              class="action-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
              data-icon="refresh"
            >
              <path
                d="M19.2 8A8 8 0 0 0 5 6.8L3 10m0 0V4m0 6h6M4.8 16A8 8 0 0 0 19 17.2l2-3.2m0 0v6m0-6h-6"
              />
            </svg>
            更新出口 IP
          </button>
        </div>
      </section>

      <div class="tools-row">
        <button id="floatToggle" class="tool-btn" aria-pressed="false">
          <svg
            class="action-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
            data-icon="window"
          >
            <rect x="3" y="4.5" width="18" height="15" rx="3" />
            <path d="M3 9h18" />
            <rect
              x="12"
              y="12"
              width="6"
              height="4.5"
              rx="1"
              fill="currentColor"
              fill-opacity=".16"
            />
          </svg>
          <span id="floatLabel">网页悬浮窗：关</span></button
        ><button id="landing" class="tool-btn">
          <svg
            class="action-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
            data-icon="play"
          >
            <rect x="3" y="5" width="18" height="14" rx="3" />
            <path d="m10 9 5 3-5 3Z" fill="currentColor" fill-opacity=".16" />
          </svg>
          流媒体参考检测
        </button>
      </div>
      <div id="landingResult" class="landing-result" role="status"></div>
      <div id="msg" class="msg" role="status" aria-live="polite"></div>
      <div id="notice" class="msg warn" role="status" title="点击关闭"></div>

      <details class="advanced">
        <summary>
          <span>高级与安全</span
          ><span class="summary-hint"
            >回退 · 系统代理
            <span class="chevron" aria-hidden="true"
              ><svg
                class="action-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
                data-icon="chevron"
              >
                <path d="m6 9 6 6 6-6" /></svg></span
          ></span>
        </summary>
        <div class="advanced-content">
          <label class="check-row"
            ><input type="checkbox" id="allowFallback" /><span
              ><b>代理失败时允许直连</b
              ><small
                >仅智能分流可用，可能暴露真实出口 IP。默认关闭。</small
              ></span
            ></label
          >
          <div class="safety-note">
            内网与直连规则仍按设计直连。这不是系统级断网保护，也不保证 WebRTC
            等流量无泄漏。
          </div>
          <button id="releaseProxy" class="btn release-btn">
            <svg
              class="action-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
              data-icon="release"
            >
              <path d="M10 5H5v14h5M9 12h12m-4-4 4 4-4 4" />
            </svg>
            释放设置，跟随系统 / 其他代理
          </button>
          <p class="fine-print">
            “强制直连”明确要求当前浏览器
            直连；“释放设置”只撤销本扩展设置，不保证直连。HTTP
            可达不代表所有网站可访问。流媒体检测不验证播放与解锁。
          </p>
        </div>
      </details>

      <footer class="footer">
        <span><i></i>仅配置当前浏览器代理</span><span id="version"></span>
      </footer>
    </main>
    <script src="../lib/core.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
